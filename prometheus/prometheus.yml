global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Scrape Prometheus internal metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Scrape Taxi Booking Backend API Metrics
  - job_name: 'taxi-backend'
    metrics_path: '/metrics'
    scrape_interval: 3s
    static_configs:
      - targets: ['backend:5000']
        labels:
          app: 'taxi-backend'
          environment: 'production'
