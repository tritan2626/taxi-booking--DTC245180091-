worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Hide Nginx version for hardening
    server_tokens off;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ==========================================
    # RATE LIMITING (Hardening)
    # 10 requests per second per IP, zone size 10MB
    # ==========================================
    limit_req_zone $binary_remote_addr zone=taxi_rate_limit:10m rate=10r/s;
    limit_req_status 429;

    upstream backend_upstream {
        server backend:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Hardening: Ẩn phiên bản Nginx
        server_tokens off;

        # Hardening Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Custom JSON response for Rate Limiting (429 Too Many Requests)
        error_page 429 /rate_limit_exceeded.json;
        location = /rate_limit_exceeded.json {
            internal;
            default_type application/json;
            return 429 '{"success": false, "statusCode": 429, "error": "Too Many Requests", "message": "Rate limit exceeded. Maximum 10 req/s. Please slow down."}';
        }

        # Nginx health check
        location /nginx-health {
            default_type application/json;
            return 200 '{"status": "UP", "service": "nginx-reverse-proxy"}';
        }

        # Proxy API requests to backend with rate limiting
        location /api/ {
            limit_req zone=taxi_rate_limit burst=20 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Proxy Prometheus /metrics
        location /metrics {
            proxy_pass http://backend_upstream/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy general root & health check
        location / {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
