services:
  # =========================================================================
  # 1. PostgreSQL Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: taxi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taxidb}
      POSTGRES_USER: ${DB_USER:-taxi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taxi_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taxi_user} -d ${DB_NAME:-taxidb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # =========================================================================
  # 2. pgAdmin - Web-based PostgreSQL Management Interface
  # =========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taxi_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@taxi.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

  # =========================================================================
  # 3. Backend (Node.js / Express API)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taxi_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taxidb}
      DB_USER: ${DB_USER:-taxi_user}
      DB_PASSWORD: ${DB_PASSWORD:-taxi_password}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  # =========================================================================
  # 4. Nginx Reverse Proxy with Rate Limiting (Hardening)
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: taxi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - frontend-net

  # =========================================================================
  # 5. Prometheus - Metrics Monitoring
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: taxi_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - backend-net

  # =========================================================================
  # 6. Loki - Log Aggregation System
  # =========================================================================
  loki:
    image: grafana/loki:2.9.4
    container_name: taxi_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - backend-net

  # =========================================================================
  # 7. Promtail - Log Shipper to Loki
  # =========================================================================
  promtail:
    image: grafana/promtail:2.9.4
    container_name: taxi_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - backend-net

  # =========================================================================
  # 8. Grafana - Observability Dashboard
  # =========================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: taxi_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - backend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
  nginx_logs:
